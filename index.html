<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B2447">
<title>الموقع قيد التحديث</title>
<style>
:root{
  --navy:#0B2447; --royal:#1B4F8A; --sky:#2E86C1; --azure:#5DADE2;
  --pearl:#EBF5FB; --ink:#1A1A2E; --graphite:#2C3E50; --amber:#F0B429;
  --bg1:#f0f6ff; --bg2:#e8f1fb; --card:#ffffff; --line:#D6EAF8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg1:#0a1626; --bg2:#0d1d33; --card:#12243d; --line:#23406a; --ink:#EAF2FB; --graphite:#C9D8EA; --pearl:#17304f; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Cairo','Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--ink);
  line-height:1.9;
  display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.card{
  width:100%;max-width:620px;text-align:center;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 8px 40px rgba(11,36,71,.16);
  overflow:hidden;
}
.top{
  background:linear-gradient(135deg,var(--navy),var(--royal) 65%,var(--sky));
  padding:34px 24px 28px;color:#fff;
}
.icon{width:64px;height:64px;margin:0 auto 14px;display:block}
.icon .gear{transform-origin:32px 32px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:clamp(1.4rem,4.6vw,1.9rem);font-weight:700;line-height:1.4}
.body{padding:28px clamp(20px,5vw,40px) 34px}
p{margin:0;font-size:clamp(1rem,3.4vw,1.12rem);color:var(--graphite)}
.bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--sky),var(--amber));margin:0 auto 22px}
@media (prefers-reduced-motion:reduce){.icon .gear{animation:none}}
</style>
</head>
<body>
<main class="card" role="main">
  <div class="top">
    <svg class="icon" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g class="gear">
        <circle cx="32" cy="32" r="9"/>
        <path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/>
      </g>
    </svg>
    <h1>الموقع قيد التحديث</h1>
  </div>
  <div class="body">
    <div class="bar"></div>
    <p>نود إعلامكم بأنه يجري حاليًا العمل على تحديث الملفات واستكمال المعلومات الناقصة. وبمجرد الانتهاء من التحديث ومراجعة الملفات والتأكد من صحة المعلومات الواردة بها، سيتم رفع النسخ المحدّثة على الموقع. شكرًا لتفهمكم.</p>
  </div>
</main>
</body>
</html>
